name: CI

# The repo carries ~600 tests that nothing ran automatically: PR #167 landed
# with zero check runs against it, and the packaging drift caught in #170 and
# in .SRCINFO reached users because nothing compared the two patch lists.

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run stub/IPC test suite
        run: node --test tests/node/current-path/*.test.cjs

  shell:
    name: Patch + compat tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Asserts LAST_TESTED_ASAR_VERSION has a pinning row, so a compat report
      # can't record a version nobody can obtain (#165).
      - name: Compat pin consistency
        run: bash tests/test-compat-pins.sh

      # Exercises the shared patch-index.sh pass list against fixtures, including
      # the backtick/let/index2 shapes from #166 and the minified-name fallback,
      # and guards that launch.sh and PKGBUILD still both source that one list.
      - name: Cowork patch passes
        run: bash tests/test-cowork-patch.sh

      # Drives launch.sh end to end against a temp tree with fake electron/asar
      # binaries. Guards the repack cache (a `cp -f` that always stamps mtime
      # made "Using cached app.asar" unreachable and repacked ~300 files on
      # every start) and the stub module-set parity that let PKGBUILD ship
      # @ant/claude-native without the safe_fs.js its index.js require()s.
      - name: Launcher stub sync
        run: bash tests/test-launcher-sync.sh
      - name: Extract staging/swap tests
        run: bash tests/test-extract-swap.sh

      # Stage 1 of the install harness is pure static analysis -- no network, no
      # Docker, no Arch -- so it can run here even though stages 2-8 cannot.
      # Nothing ran this file at all, which is how it came to py_compile
      # fetch-dmg.py for however many months after that script became
      # fetch-dmg.js. A harness nobody runs rots into a harness nobody can run.
      - name: Install harness static analysis
        run: bash tests/test-install-paths.sh 1

  python:
    name: enable-cowork.py syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Byte-compile the patcher
        run: python -m py_compile enable-cowork.py

  aur-sync:
    name: AUR publish health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The publish workflow already validates this secret -- but only when it
      # runs, and it only runs when PKGBUILD or .SRCINFO changes. So a signing
      # key that went bad in April 2026 went unnoticed until someone read a
      # failed run five months later (#189). Checking it here puts the answer in
      # every CI run instead, which is the difference between days and months.
      #
      # Secrets are available to same-repo pull_request runs but not to fork
      # runs, so an empty value means "cannot check from here", not "broken".
      #
      # The key is never echoed: it goes to a 0600 file, ssh-keygen's output is
      # discarded, and the file is removed. ssh-keygen -y reads it exactly as
      # the deploy action does, so a key that passes here will not fail there
      # with "invalid format". -P '' plus </dev/null makes an encrypted key fail
      # rather than hang waiting for a passphrase.
      #
      # Reports, never fails, for the same reason as the drift check below: only
      # a repo admin can replace a secret, so a red check would block every
      # contributor's PR on something none of them can fix.
      - name: Check the AUR signing key is usable
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY: not available to this run (fork PR, or the secret is unset)."
            echo "::notice::AUR_SSH_KEY was not readable here, so it was not checked."
            echo "### AUR signing key: not checked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s\n' "$AUR_SSH_KEY" > /tmp/aur_key_probe
          chmod 600 /tmp/aur_key_probe
          if ssh-keygen -y -P '' -f /tmp/aur_key_probe > /dev/null 2>&1 < /dev/null; then
            rm -f /tmp/aur_key_probe
            echo "AUR_SSH_KEY: parses as a usable unencrypted OpenSSH private key."
            echo "### AUR signing key: usable" >> "$GITHUB_STEP_SUMMARY"
            echo "The publish workflow will not fail on the key." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f /tmp/aur_key_probe
            echo "AUR_SSH_KEY is set but does not parse as an unencrypted OpenSSH private key."
            echo "Common causes: the secret holds the PUBLIC key, it is passphrase-protected,"
            echo "the PEM line breaks were lost on paste, or the trailing newline is missing."
            echo "Regenerate with: ssh-keygen -t ed25519 -N '' -f aur_key  (paste ALL of aur_key)"
            echo "::warning::AUR_SSH_KEY is set but unusable, so publishing to the AUR will fail."
            {
              echo "### AUR signing key: UNUSABLE"
              echo
              echo "The secret is set but is not an unencrypted OpenSSH private key, so"
              echo "\`Publish to AUR\` cannot push. Most often the public key was pasted"
              echo "instead of the private one."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The srcinfo job below proves .SRCINFO matches the PKGBUILD in this tree.
      # It says nothing about whether the AUR ever received either one. #189 is
      # what that gap costs: the publish workflow had been failing on a
      # malformed AUR_SSH_KEY since 2026-04-23, so `yay -S` kept building
      # pkgrel 10's recipe while this tree moved to 13 -- and the fix those
      # users needed (split-entry chunk sweeping) landed in 12.
      #
      # Reports only, never fails the build: the drift it finds is clearable
      # solely by a repo admin re-adding a secret, and a red check no
      # contributor can act on is a check people learn to route around.
      - name: Compare with the published AUR package
        run: bash check-aur-sync.sh

  srcinfo:
    name: .SRCINFO matches PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      # makepkg refuses to run as root, and the checkout is root-owned.
      # base-devel ships no git, so actions/checkout unpacks a tarball rather
      # than cloning -- there is no repo here to mark as a safe directory, and
      # --printsrcinfo only parses the PKGBUILD, it never fetches the source.
      - name: Regenerate and diff
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.generated
          if ! diff -u .SRCINFO .SRCINFO.generated; then
            echo "::error file=.SRCINFO::.SRCINFO is stale. Regenerate with: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          fi
