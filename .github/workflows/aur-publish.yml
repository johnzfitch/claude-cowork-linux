name: Publish to AUR

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - PKGBUILD
      - .SRCINFO
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Record what AUR actually serves BEFORE any step can abort the job.
      # The key check below exits 1 on a bad secret, which skips every later
      # step -- so for five months each failed run said "bad key" and nothing
      # at all about the package having frozen at pkgrel 10 (#189). Running the
      # comparison first means every failed publish now also states the cost:
      # which version users are still building, and how far behind it is.
      - name: Report what the AUR currently serves
        run: bash check-aur-sync.sh

      # Every run since 2026-04-23 failed inside the deploy action with
      #   Load key "/home/builder/.ssh/aur": invalid format
      # which surfaces only in the container log, so the package silently
      # stopped updating. Check the secret here instead, where the failure
      # names itself.
      - name: Check the AUR signing key is present and well-formed
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_KEY is unset or empty. Add the repo secret before publishing."
            exit 1
          fi

          printf '%s\n' "$AUR_SSH_KEY" > /tmp/aur_key
          chmod 600 /tmp/aur_key

          # ssh-keygen -y reads the key the same way the deploy action does, so
          # a key that passes here will not fail with "invalid format" there.
          # -P '' plus </dev/null keeps an encrypted key from prompting and
          # hanging the job instead of failing it.
          if ! ssh-keygen -y -P '' -f /tmp/aur_key > /dev/null 2>&1 < /dev/null; then
            echo "::error::AUR_SSH_KEY is not a usable unencrypted OpenSSH private key."
            echo "Common causes: the secret holds a public key, it is passphrase-protected,"
            echo "the PEM line breaks were lost on paste, or the trailing newline is missing."
            echo "Regenerate with: ssh-keygen -t ed25519 -N '' -f aur_key  (paste all of aur_key)"
            rm -f /tmp/aur_key
            exit 1
          fi
          rm -f /tmp/aur_key
          echo "AUR_SSH_KEY parses as a valid private key."

      # test-cowork-patch.sh extracts and exercises PKGBUILD's own patch_index
      # block. Publishing a recipe that fails it ships a broken AUR package.
      - name: Verify the packaging recipe before publishing
        run: |
          bash tests/test-compat-pins.sh
          bash tests/test-cowork-patch.sh

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: claude-cowork-linux
          pkgbuild: ./PKGBUILD
          commit_username: johnzfitch
          commit_email: zack@internetuniverse.org
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ github.sha }}"
          force_push: false
